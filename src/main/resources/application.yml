spring:
  application:
    name: adrovis-backend
  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO
    com.adrovis: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

storage:
  upload-dir: uploads
  max-file-size: 5MB
  allowed-types:
    - application/pdf

app:
  cors:
    allowed-origins:
      - http://localhost:3000

