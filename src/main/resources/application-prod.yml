spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    #host: ${MAIL_HOST}
    #port: ${MAIL_PORT}
    #username: ${MAIL_USERNAME}
    #password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: INFO
    com.adrovis: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

app:
  candidate-portal-base-url: ${CANDIDATE_PORTAL_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins:
      - https://adrovis.com
      - https://www.adrovis.com
      - http://localhost:5173

  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 200
    await-termination-seconds: 30

  mail:
    from: ${MAIL_FROM}
    api-key: ${RESEND_API_KEY}


  api:
    base-url: ${APP_BASE_URL}
    environment-label: Production

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    base-url: https://api.razorpay.com

  payment:
    amount-inr: ${PAYMENT_AMOUNT_INR:20}
    currency: INR
    expiry-hours: ${PAYMENT_EXPIRY_HOURS:72}
    frontend-payment-success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/payment/success}
    frontend-payment-failure-url: ${PAYMENT_FAILURE_URL:http://localhost:5173/payment/failed}


springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
