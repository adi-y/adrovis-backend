spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  mail:
    #host: ${MAIL_HOST}
    #port: ${MAIL_PORT}
    #username: ${MAIL_USERNAME}
    #password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: INFO
    com.adrovis: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket: ${SUPABASE_BUCKET:resumes}

app:
  campaign:
    public-base-url: ${CAMPAIGN_PUBLIC_BASE_URL:https://www.adrovis.com}
    frontend-base-url: ${CAMPAIGN_FRONTEND_BASE_URL:https://www.adrovis.com}
    continuation-secret: ${CAMPAIGN_TOKEN_SECRET:${JWT_SECRET}}
    reply-to-email: ${CAMPAIGN_REPLY_TO_EMAIL:hello@adrovis.com}
    continuation-validity-hours: ${CAMPAIGN_CONTINUATION_VALIDITY_HOURS:720}
    program-key: ${CAMPAIGN_PROGRAM_KEY:SOFTWARE_DEVELOPER_INTERNSHIP}

    # MASTER CAMPAIGN SWITCH
    # Keep FALSE until production testing is complete.
    enabled: ${CAMPAIGN_ENABLED:false}

    # PRODUCTION
    # Must be FALSE so the real production audience is used.
    test-mode: ${CAMPAIGN_TEST_MODE:false}
    test-email: ${CAMPAIGN_TEST_EMAIL:}

    # PRODUCTION: scheduler checks every hour
    scheduler-delay-ms: ${CAMPAIGN_SCHEDULER_DELAY_MS:3600000}

    # PRODUCTION: 7 days between campaign weeks
    week-duration-seconds: ${CAMPAIGN_WEEK_DURATION_SECONDS:604800}

    daily-send-time: ${CAMPAIGN_DAILY_SEND_TIME:10:00}
    timezone: ${CAMPAIGN_TIMEZONE:Asia/Kolkata}
    batch-size: ${CAMPAIGN_BATCH_SIZE:500}

  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    max-resume-chars: ${GEMINI_MAX_RESUME_CHARS:50000}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:50000}
    temperature: ${GEMINI_TEMPERATURE:0.2}
    max-retries: ${GEMINI_MAX_RETRIES:3}
    retry-base-delay-ms: ${GEMINI_RETRY_BASE_DELAY_MS:1000}

  gemini-copilot:
    api-key: ${GEMINI_COPILOT_API_KEY}
    model: ${GEMINI_COPILOT_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_COPILOT_BASE_URL:https://generativelanguage.googleapis.com}
    max-output-tokens: ${GEMINI_COPILOT_MAX_OUTPUT_TOKENS:1600}
    temperature: ${GEMINI_COPILOT_TEMPERATURE:0.2}
    max-input-chars: ${GEMINI_COPILOT_MAX_INPUT_CHARS:24000}
    max-notes: ${GEMINI_COPILOT_MAX_NOTES:50}
    max-retries: ${GEMINI_COPILOT_MAX_RETRIES:1}
    retry-base-delay-ms: ${GEMINI_COPILOT_RETRY_BASE_DELAY_MS:600}

  candidate-portal-base-url: ${CANDIDATE_PORTAL_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins:
      - https://adrovis.com
      - https://www.adrovis.com
      - http://localhost:5173

  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 200
    await-termination-seconds: 30

  mail:
    from: ${MAIL_FROM}
    api-key: ${RESEND_API_KEY}

  api:
    base-url: ${APP_BASE_URL}
    environment-label: Production

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    base-url: https://api.razorpay.com

  payment:
    amount-inr: ${PAYMENT_AMOUNT_INR:20}
    currency: INR
    expiry-hours: ${PAYMENT_EXPIRY_HOURS:72}
    frontend-payment-success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/payment/success}
    frontend-payment-failure-url: ${PAYMENT_FAILURE_URL:http://localhost:5173/payment/failed}


springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
