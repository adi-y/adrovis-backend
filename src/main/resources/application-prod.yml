spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  mail:
    #host: ${MAIL_HOST}
    #port: ${MAIL_PORT}
    #username: ${MAIL_USERNAME}
    #password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: INFO
    com.adrovis: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket: ${SUPABASE_BUCKET:resumes}

app:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    max-resume-chars: ${GEMINI_MAX_RESUME_CHARS:50000}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:50000}
    temperature: ${GEMINI_TEMPERATURE:0.2}
    max-retries: ${GEMINI_MAX_RETRIES:3}
    retry-base-delay-ms: ${GEMINI_RETRY_BASE_DELAY_MS:1000}

  candidate-portal-base-url: ${CANDIDATE_PORTAL_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins:
      - https://adrovis.com
      - https://www.adrovis.com
      - http://localhost:5173

  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 200
    await-termination-seconds: 30

  mail:
    from: ${MAIL_FROM}
    api-key: ${RESEND_API_KEY}

  api:
    base-url: ${APP_BASE_URL}
    environment-label: Production

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    base-url: https://api.razorpay.com

  payment:
    amount-inr: ${PAYMENT_AMOUNT_INR:20}
    currency: INR
    expiry-hours: ${PAYMENT_EXPIRY_HOURS:72}
    frontend-payment-success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/payment/success}
    frontend-payment-failure-url: ${PAYMENT_FAILURE_URL:http://localhost:5173/payment/failed}


springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
