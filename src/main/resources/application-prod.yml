spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    #host: ${MAIL_HOST}
    #port: ${MAIL_PORT}
    #username: ${MAIL_USERNAME}
    #password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: INFO
    com.adrovis: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

app:
  # Added candidate portal base URL with environment variable override and local fallback
  candidate-portal-base-url: ${CANDIDATE_PORTAL_BASE_URL:http://localhost:5173}
  
app:
  cors:
    allowed-origins:
      - https://adrovis.com
      - https://www.adrovis.com
      - http://localhost:5173

  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 200
    await-termination-seconds: 30

  mail:
    from: ${MAIL_FROM}
    api-key: ${RESEND_API_KEY}


  api:
    base-url: ${APP_BASE_URL}
    environment-label: Production

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
