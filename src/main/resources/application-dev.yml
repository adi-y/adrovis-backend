spring:
  datasource:
    url: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.zuhjkxtxjwajdslzkobd
    password: adrovis/$123

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.adrovis: DEBUG
    org.hibernate.SQL: DEBUG
    com.adrovis.adrovis_backend.interview: DEBUG

app:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    max-resume-chars: ${GEMINI_MAX_RESUME_CHARS:50000}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:50000}
    temperature: ${GEMINI_TEMPERATURE:0.2}
    max-retries: ${GEMINI_MAX_RETRIES:3}
    retry-base-delay-ms: ${GEMINI_RETRY_BASE_DELAY_MS:1000}

  gemini-copilot:
    api-key: ${GEMINI_COPILOT_API_KEY}
    model: ${GEMINI_COPILOT_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_COPILOT_BASE_URL:https://generativelanguage.googleapis.com}
    max-output-tokens: ${GEMINI_COPILOT_MAX_OUTPUT_TOKENS:1600}
    temperature: ${GEMINI_COPILOT_TEMPERATURE:0.2}
    max-input-chars: ${GEMINI_COPILOT_MAX_INPUT_CHARS:24000}
    max-notes: ${GEMINI_COPILOT_MAX_NOTES:50}
    max-retries: ${GEMINI_COPILOT_MAX_RETRIES:1}
    retry-base-delay-ms: ${GEMINI_COPILOT_RETRY_BASE_DELAY_MS:600}

  candidate-portal-base-url: ${CANDIDATE_PORTAL_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins:
      - http://localhost:3000

  async:
    core-pool-size: 2
    max-pool-size: 5
    queue-capacity: 100
    await-termination-seconds: 30

  mail:
    from: aditya.yadav@adrovis.com
    api-key: ${RESEND_API_KEY}

  api:
    base-url: http://localhost:8080
    environment-label: Development

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    base-url: https://api.razorpay.com

  payment:
    amount-inr: ${PAYMENT_AMOUNT_INR:20}
    currency: INR
    expiry-hours: ${PAYMENT_EXPIRY_HOURS:72}
    frontend-payment-success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/payment/success}
    frontend-payment-failure-url: ${PAYMENT_FAILURE_URL:http://localhost:5173/payment/failed}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket: ${SUPABASE_BUCKET}